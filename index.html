<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecturer Reviews</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e4e7ee;--pr:#3b4cca;--pr2:#eef0ff;--ok:#12805c;--bad:#c0392b;--star:#f5a623}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--tx:#eceef4;--mu:#9aa1b2;--bd:#2b2f3b;--pr:#8b98ff;--pr2:#252a45;--ok:#4cc9a0;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--tx:#eceef4;--mu:#9aa1b2;--bd:#2b2f3b;--pr:#8b98ff;--pr2:#252a45;--ok:#4cc9a0;--bad:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;justify-content:space-between;height:56px;gap:8px}
.logo{font-weight:700;font-size:17px;cursor:pointer}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}
button.d{color:var(--bad)}
button.s{padding:4px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.hero{padding:28px 0 8px}.hero h1{margin:0 0 4px;font-size:26px}.hero p{margin:0;color:var(--mu)}
.bar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.bar input{flex:2;min-width:180px}.bar select{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.lc{cursor:pointer;text-align:center}.lc:hover{border-color:var(--pr)}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#fff;margin:0 auto 10px}
.av.lg{width:120px;height:120px;font-size:40px;margin:0}
.mu{color:var(--mu);font-size:13px}
.st{background:linear-gradient(90deg,var(--star) var(--p),var(--bd) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px}
.pf{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.pf>div:last-child{flex:1;min-width:220px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.dist{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.dist i{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.dist b{display:block;height:100%;background:var(--star)}
.rv{border-top:1px solid var(--bd);padding:10px 0}
.pick{display:flex;gap:4px;align-items:center;justify-content:space-between}.pick button{padding:2px 9px;font-size:18px;color:var(--bd)}.pick button.on{color:var(--star);border-color:var(--star)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.stats b{font-size:26px;display:block}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.sc{overflow-x:auto}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.row i{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.row b{display:block;height:100%;background:var(--pr)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<header><div class="w nav"><span class="logo" onclick="go('home')">🎓 Lecturer Reviews</span><span><button class="s" onclick="go('home')">Lecturers</button> <button class="s" onclick="go('admin')">Admin</button></span></div></header>
<main class="w" id="app"></main>
<div id="toast"></div>
<script>
const K='lrs_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem=null;
function seed(){const d=new Date().toISOString().slice(0,10);
const L=[['l1','Dr. Nimali Perera','Senior Lecturer','Computing','nimali@uni.edu','Databases, Software Engineering','PhD in Software Engineering with 12 years of teaching. Research interests include requirements engineering and agile practice.'],
['l2','Prof. Sunil Fernando','Professor','Mathematics','sunil@uni.edu','Statistics, Linear Algebra','Leads the statistics research group and has supervised over 30 final-year projects.'],
['l3','Ms. Ayesha Silva','Lecturer','Design','ayesha@uni.edu','UX Design, HCI','Industry designer turned lecturer, focused on hands-on studio teaching and usability testing.'],
['l4','Mr. Kasun Jayawardena','Lecturer','Computing','kasun@uni.edu','Networks, System Administration','Cisco-certified instructor who runs the department’s networking lab.']].map(a=>({id:a[0],name:a[1],title:a[2],dept:a[3],email:a[4],courses:a[5],bio:a[6],photo:''}));
const R=[['l1',5,4,5,'Clear explanations and great real-world examples.'],['l1',4,5,4,'Very approachable during consultation hours.'],['l2',5,5,4,'Challenging but rewarding lectures.'],['l2',4,3,4,'Fast paced, but notes are excellent.'],['l3',5,5,5,'The studio sessions were the best part of my semester.'],['l4',4,4,3,'Labs are practical; replies to emails can be slow.']].map((r,i)=>({id:'r'+i,lid:r[0],t:r[1],c:r[2],s:r[3],comment:r[4],date:d,status:'approved'}));
return{L,R}}
function mig(d){const m={Computing:'Faculty of Technology',Mathematics:'Faculty of Science',Design:'Faculty of Arts and Design'};d.L.forEach(l=>{if(!l.fac)l.fac=m[l.dept]||'General'});if(!d.F)d.F=[...new Set(d.L.map(l=>l.fac))];if(!d.P)d.P=[...new Map(d.L.map(l=>[l.fac+'|'+l.dept,{name:l.dept,fac:l.fac}])).values()];return d}
function load(){try{const r=localStorage.getItem(K);if(r)return mig(JSON.parse(r))}catch(e){}return mig(mem||seed())}
let D=load();
function save(){mem=D;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Storage is full or unavailable; changes may not persist.')}}
let S={view:'home',lid:null,q:'',dept:'All',fac:'All',admin:false,tab:'over',edit:null,photo:'',draft:{}};
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ov=r=>(r.t+r.c+r.s)/3;
const rv=id=>D.R.filter(r=>r.lid===id&&r.status==='approved');
const avg=id=>{const a=rv(id);return a.length?a.reduce((s,r)=>s+ov(r),0)/a.length:0};
const stars=v=>`<span class="st" style="--p:${v/5*100}%">★★★★★</span>`;
const colors=['#3b4cca','#12805c','#b5541c','#8a3fa8','#0f7a8a'];
function avatar(l,lg,sm){const c=colors[l.name.length%colors.length];const ini=l.name.replace(/^(Dr|Prof|Mr|Ms|Mrs)\.?\s+/,'').split(' ').map(w=>w[0]).slice(0,2).join('');
const z=sm?'width:44px;height:44px;font-size:16px;margin:0;':'';return l.photo?`<img class="av ${lg?'lg':''}" style="${z}" src="${l.photo}" alt="${esc(l.name)}">`:`<div class="av ${lg?'lg':''}" style="${z}background:${c}">${esc(ini)}</div>`}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function go(v,id){S.view=v;S.lid=id||null;S.draft={};S.edit=null;window.scrollTo(0,0);render()}
function render(){const a=$('#app');a.innerHTML=S.view==='home'?home():S.view==='profile'?profile():admin();if(S.view==='home')grid()}
const depts=()=>['All',...new Set(D.P.filter(p=>S.fac==='All'||p.fac===S.fac).map(p=>p.name))];
function home(){return`<div class="hero"><h1>Find and review your lecturers</h1><p>Honest, anonymous feedback from students. Reviews are checked by an admin before they appear.</p></div>
<div class="bar"><input id="q" placeholder="Search by name or course" value="${esc(S.q)}" oninput="S.q=this.value;grid()"><select onchange="S.fac=this.value;S.dept='All';render()">${['All',...D.F].map(f=>`<option ${f===S.fac?'selected':''}>${esc(f)}</option>`).join('')}</select><select onchange="S.dept=this.value;grid()">${depts().map(d=>`<option ${d===S.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="grid" id="grid"></div>`}
function grid(){const q=S.q.toLowerCase();const a=D.L.filter(l=>(S.fac==='All'||l.fac===S.fac)&&(S.dept==='All'||l.dept===S.dept)&&(l.name+' '+l.courses).toLowerCase().includes(q));
$('#grid').innerHTML=a.map(l=>{const v=avg(l.id);return`<div class="card lc" onclick="go('profile','${l.id}')">${avatar(l)}<b>${esc(l.name)}</b><div class="mu">${esc(l.title)}</div><div class="mu">${esc(l.dept)} · ${esc(l.fac)}</div><div>${stars(v)} <b>${v?v.toFixed(1):'–'}</b></div><div class="mu">${rv(l.id).length} reviews</div></div>`}).join('')||'<p class="mu">No lecturers match your search.</p>'}
function pick(k,lab){const v=S.draft[k]||0;return`<label>${lab}</label><div class="pick">${[1,2,3,4,5].map(n=>`<button class="${n<=v?'on':''}" onclick="S.draft['${k}']=${n};keep();render()">★</button>`).join('')}</div>`}
function keep(){const c=$('#cm');if(c)S.draft.cm=c.value}
function profile(){const l=D.L.find(x=>x.id===S.lid);if(!l)return'<p>Lecturer not found.</p>';const rs=rv(l.id).sort((a,b)=>b.date.localeCompare(a.date)),v=avg(l.id);
const cr=(k,n)=>{const x=rs.length?rs.reduce((s,r)=>s+r[k],0)/rs.length:0;return`<div class="row"><span style="width:110px">${n}</span><i><b style="width:${x*20}%"></b></i>${x?x.toFixed(1):'–'}</div>`};
const dist=[5,4,3,2,1].map(n=>{const c=rs.filter(r=>Math.round(ov(r))===n).length;return`<div class="dist">${n}★<i><b style="width:${rs.length?c/rs.length*100:0}%"></b></i>${c}</div>`}).join('');
return`<p><button class="s" onclick="go('home')">← All lecturers</button></p>
<div class="card pf">${avatar(l,1)}<div><h2 style="margin:0">${esc(l.name)}</h2><div class="mu">${esc(l.title)} · ${esc(l.dept)}, ${esc(l.fac)} · <a href="mailto:${esc(l.email)}" style="color:var(--pr)">${esc(l.email)}</a></div>
<p>${esc(l.bio)}</p><div>${l.courses.split(',').map(c=>`<span class="tag">${esc(c.trim())}</span>`).join('')}</div>
<p style="font-size:22px;margin:10px 0 0">${stars(v)} <b>${v?v.toFixed(1):'–'}</b> <span class="mu">(${rs.length} reviews)</span></p></div></div>
<div class="two"><div class="card"><b>Rating breakdown</b>${cr('t','Teaching')}${cr('c','Clarity')}${cr('s','Support')}<div style="margin-top:10px">${dist}</div></div>
<div class="card"><b>Write a review</b>${pick('t','Teaching quality')}${pick('c','Clarity of explanations')}${pick('s','Helpfulness and support')}<label>Comment (optional)</label><textarea id="cm" rows="3" maxlength="400">${esc(S.draft.cm||'')}</textarea><p><button class="p" onclick="submitReview()">Submit review</button></p><div class="mu">Posted anonymously after admin approval.</div></div></div>
<div class="card" style="margin-top:14px"><b>Student reviews</b>${rs.map(r=>`<div class="rv">${stars(ov(r))} <span class="mu">${r.date}</span><div>${esc(r.comment)||'<i class="mu">No comment</i>'}</div></div>`).join('')||'<p class="mu">No reviews yet. Be the first.</p>'}</div>`}
function submitReview(){keep();const d=S.draft;if(!d.t||!d.c||!d.s)return toast('Please rate all three categories.');
D.R.push({id:uid(),lid:S.lid,t:d.t,c:d.c,s:d.s,comment:(d.cm||'').trim(),date:new Date().toISOString().slice(0,10),status:'pending'});save();S.draft={};toast('Thanks! Your review is awaiting approval.');render()}
function admin(){if(!S.admin)return`<div class="card" style="max-width:360px;margin:40px auto"><b>Admin login</b><label>Password</label><input type="password" id="pw" onkeydown="if(event.key==='Enter')login()"><p><button class="p" onclick="login()">Sign in</button></p><div class="mu">Demo password: admin123</div></div>`;
const pend=D.R.filter(r=>r.status==='pending').length;
return`<div class="hero"><h1>Admin dashboard</h1></div><div class="tabs">${[['over','Overview'],['lec','Lecturers'],['org','Faculties and Depts'],['rev','Reviews'+(pend?' ('+pend+')':'')]].map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';S.edit=null;render()">${t[1]}</button>`).join('')}<button onclick="S.admin=false;render()">Sign out</button></div>`+(S.tab==='over'?over():S.tab==='lec'?lec():S.tab==='org'?org():rev())}
function login(){if($('#pw').value==='20031115'){S.admin=true;render()}else toast('Incorrect password.')}
function over(){const ap=D.R.filter(r=>r.status==='approved'),all=ap.length?ap.reduce((s,r)=>s+ov(r),0)/ap.length:0;
const rank=[...D.L].sort((a,b)=>avg(b.id)-avg(a.id));
return`<div class="stats"><div class="card"><b>${D.L.length}</b>Lecturers</div><div class="card"><b>${ap.length}</b>Approved reviews</div><div class="card"><b>${D.R.filter(r=>r.status==='pending').length}</b>Pending</div><div class="card"><b>${all?all.toFixed(2):'–'}</b>Average rating</div></div>
<div class="card"><b>Lecturer ranking</b>${rank.map(l=>`<div class="row"><span style="width:150px">${esc(l.name)}</span><i><b style="width:${avg(l.id)*20}%"></b></i>${avg(l.id)?avg(l.id).toFixed(2):'–'}</div>`).join('')}</div>`}
function lec(){const e=S.edit;let f='';
if(e){const l0=e==='new'?{name:'',title:'',dept:'',email:'',courses:'',bio:'',photo:''}:D.L.find(x=>x.id===e);const l1=FD.id===e?{...l0,...FD}:l0;const l={...l1,fac:l1.fac||D.F[0]};const dp=D.P.filter(p=>p.fac===l.fac).map(p=>p.name);l.dept=dp.includes(l.dept)?l.dept:dp[0]||'';
f=`<div class="card" style="margin-bottom:14px"><b>${e==='new'?'Add lecturer':'Edit lecturer'}</b><div class="pf" style="margin-top:8px"><div>${S.photo?`<img class="av lg" src="${S.photo}" alt="">`:avatar(l,1)}<label>Photo</label><input type="file" accept="image/*" onchange="pic(this)" style="width:150px"></div><div>
${[['name','Full name'],['title','Title']].map(x=>`<label>${x[1]}</label><input id="f_${x[0]}" value="${esc(l[x[0]])}">`).join('')}<label>Faculty</label><select id="f_fac" onchange="keepForm();FD.dept='';render()">${D.F.map(f=>`<option ${f===l.fac?'selected':''}>${esc(f)}</option>`).join('')}</select><label>Department</label><select id="f_dept">${dp.map(d=>`<option ${d===l.dept?'selected':''}>${esc(d)}</option>`).join('')}</select>${[['email','Email'],['courses','Courses (comma separated)']].map(x=>`<label>${x[1]}</label><input id="f_${x[0]}" value="${esc(l[x[0]])}">`).join('')}<label>Bio</label><textarea id="f_bio" rows="3">${esc(l.bio)}</textarea></div></div>
<p><button class="p" onclick="saveL()">Save</button> <button onclick="S.edit=null;S.photo='';render()">Cancel</button></p></div>`}
return f+`<p><button class="p" onclick="S.edit='new';S.photo='';render()">+ Add lecturer</button></p><div class="card sc"><table><tr><th></th><th>Name</th><th>Dept</th><th>Rating</th><th></th></tr>${D.L.map(l=>`<tr><td style="width:60px">${avatar(l,0,1)}</td><td>${esc(l.name)}<div class="mu">${esc(l.title)}</div></td><td>${esc(l.dept)}<div class="mu">${esc(l.fac)}</div></td><td>${avg(l.id)?avg(l.id).toFixed(1):'–'}</td><td><button class="s" onclick="S.edit='${l.id}';S.photo='';render()">Edit</button> <button class="s d" onclick="delL('${l.id}')">Delete</button></td></tr>`).join('')}</table></div>`}
function pic(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);S.photo=c.toDataURL('image/jpeg',.8);keepForm();render()};im.src=fr.result};fr.readAsDataURL(f)}
let FD={};function keepForm(){FD.id=S.edit;['name','title','fac','dept','email','courses','bio'].forEach(k=>{const e=$('#f_'+k);if(e)FD[k]=e.value})}
function saveL(){keepForm();const g=k=>$('#f_'+k).value.trim();if(!g('name'))return toast('Name is required.');if(!g('fac')||!g('dept'))return toast('Add a faculty and department first (Faculties and Depts tab).');
const o={name:g('name'),title:g('title'),fac:g('fac'),dept:g('dept'),email:g('email'),courses:g('courses'),bio:g('bio')};
if(S.edit==='new')D.L.push({id:uid(),photo:S.photo,...o});else{const l=D.L.find(x=>x.id===S.edit);Object.assign(l,o);if(S.photo)l.photo=S.photo}
save();FD={};S.edit=null;S.photo='';toast('Lecturer saved.');render()}
function delL(id){if(!confirm('Delete this lecturer and all their reviews?'))return;D.L=D.L.filter(l=>l.id!==id);D.R=D.R.filter(r=>r.lid!==id);save();render()}
function rev(){const a=[...D.R].sort((x,y)=>(x.status==='pending'?0:1)-(y.status==='pending'?0:1)||y.date.localeCompare(x.date));
return`<div class="card sc"><table><tr><th>Lecturer</th><th>Rating</th><th>Comment</th><th>Status</th><th></th></tr>${a.map(r=>{const l=D.L.find(x=>x.id===r.lid);return`<tr><td>${esc(l?l.name:'Removed')}</td><td>${ov(r).toFixed(1)}</td><td>${esc(r.comment)}</td><td style="color:${r.status==='pending'?'var(--bad)':'var(--ok)'}">${r.status}</td><td>${r.status==='pending'?`<button class="s" onclick="setR('${r.id}',1)">Approve</button> `:''}<button class="s d" onclick="setR('${r.id}',0)">Delete</button></td></tr>`}).join('')||'<tr><td colspan="5" class="mu">No reviews yet.</td></tr>'}</table></div>`}
function org(){return`<div class="two"><div class="card"><b>Add faculty</b><label>Faculty name</label><input id="nf"><p><button class="p" onclick="addF()">Add faculty</button></p></div><div class="card"><b>Add department</b><label>Faculty</label><select id="dfac">${D.F.map(f=>`<option>${esc(f)}</option>`).join('')}</select><label>Department name</label><input id="nd"><p><button class="p" onclick="addP()">Add department</button></p></div></div><div class="card" style="margin-top:14px"><b>Faculties and departments</b>${D.F.map((f,i)=>`<div class="rv"><b>${esc(f)}</b> <button class="s d" onclick="delF(${i})">Delete</button>${D.P.map((p,j)=>p.fac===f?`<div class="row" style="padding-left:12px"><span style="flex:1">${esc(p.name)} <span class="mu">${D.L.filter(l=>l.fac===f&&l.dept===p.name).length} lecturers</span></span><button class="s d" onclick="delP(${j})">Delete</button></div>`:'').join('')}</div>`).join('')||'<p class="mu">No faculties yet.</p>'}</div>`}
function addF(){const v=$('#nf').value.trim();if(!v)return toast('Enter a faculty name.');if(D.F.includes(v))return toast('That faculty already exists.');D.F.push(v);save();toast('Faculty added.');render()}
function addP(){const v=$('#nd').value.trim(),f=$('#dfac').value;if(!v||!f)return toast('Choose a faculty and enter a name.');if(D.P.some(p=>p.name===v&&p.fac===f))return toast('That department already exists.');D.P.push({name:v,fac:f});save();toast('Department added.');render()}
function delF(i){const f=D.F[i];if(D.P.some(p=>p.fac===f)||D.L.some(l=>l.fac===f))return toast('Remove its departments and lecturers first.');D.F.splice(i,1);save();render()}
function delP(j){const p=D.P[j];if(D.L.some(l=>l.fac===p.fac&&l.dept===p.name))return toast('Move or remove its lecturers first.');D.P.splice(j,1);save();render()}
function setR(id,ok){if(ok)D.R.find(r=>r.id===id).status='approved';else D.R=D.R.filter(r=>r.id!==id);save();render()}
render();
</script>
</body>
</html>
